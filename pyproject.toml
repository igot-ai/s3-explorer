pillow = "^10.1.0"
python-magic = "^0.4.27"
gunicorn = "^21.2.0"
flask-cors = "^4.0.0"
b2sdk = "^1.23.0"
wasabi = "^1.1.2"
google-cloud-storage = "^2.14.0"
google-auth = "^2.27.0"
flask-wtf = "^1.2.1"
wtforms = "^3.1.1"
s3fs = "^2025.12.0"
anthropic = "^0.75.0"
pymupdf = "^1.26.6"
pdfplumber = "^0.11.8"
