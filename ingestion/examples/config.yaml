# Ingestion Pipeline Configuration

# Source settings
source_path: "raw-documents/"
recursive: true

# Processing settings
pages_to_read: 3
temp_dir: "/tmp/ingestion"

# Classifier settings
classifier_type: "openai"  # Options: openai, anthropic, ollama
classifier_model: "gpt-4o-mini"  # Model to use
# classifier_api_key: "your-api-key-here"  # Set via environment variable instead

# Handler settings
handler_type: "s3"  # Options: s3, api
# api_base_url: "https://api.example.com"  # For API handler
# api_key: "your-api-key"  # For API handler

# Reader settings
reader_type: "pymupdf"  # Options: pymupdf, pdfplumber

# Storage provider (for S3 source and handler)
storage_provider: "aws"  # Options: aws, gcs, digitalocean, cloudflare, etc.
storage_credentials:
  access_key: "YOUR_AWS_ACCESS_KEY"
  secret_key: "YOUR_AWS_SECRET_KEY"
  bucket: "your-bucket-name"
  region: "us-east-1"

