catalogs:
  - id: "legal-contracts"
    information: "Documents containing legal contracts, agreements, terms and conditions, legal obligations"
    content: "Legal domain documents"
    fetch_all_metadata: false
    metadata_scan:
      legal_entity: "string - name of the legal entity involved"
      contract_type: "string - type of contract (NDA, service agreement, etc.)"
      effective_date: "string - effective date of the contract"
      finance_related: "boolean - whether the contract involves financial matters"

  - id: "healthcare-docs"
    information: "Healthcare information, medical records, policy documents, clinical trials"
    content: "Healthcare review documents"
    fetch_all_metadata: true
    metadata_scan:
      public_policy: "boolean - relates to public health policy"
      capex: "boolean - involves capital expenditure"
      opex: "boolean - involves operational expenditure"
      department: "string - department name"

  - id: "financial-reports"
    information: "Financial statements, budget reports, audit documents, financial analysis"
    content: "Financial documentation"
    fetch_all_metadata: false
    metadata_scan:
      report_type: "string - type of financial report"
      fiscal_year: "string - fiscal year"
      currency: "string - currency used"
      audited: "boolean - whether the report is audited"

