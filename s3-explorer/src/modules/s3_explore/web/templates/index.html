<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>Storage File Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .file-explorer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
        }

        .file-item {
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-item:hover {
            transform: translateY(-2px);
        }

        .file-item.selected {
            background-color: #DBEAFE !important;
            border-color: #3B82F6 !important;
        }

        .context-menu {
            display: none;
            position: absolute;
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            min-width: 200px;
        }

        .context-menu.active {
            display: block;
        }

        .context-menu-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .context-menu-item:hover {
            background-color: #F3F4F6;
        }

        .breadcrumb-item {
            display: inline-flex;
            align-items: center;
        }

        .breadcrumb-separator {
            margin: 0 0.5rem;
            color: #9CA3AF;
        }

        .folder-tree-item {
            padding: 0.25rem 0.5rem;
            cursor: pointer;
            border-radius: 0.25rem;
            transition: background-color 0.2s;
            user-select: none;
        }

        .folder-tree-item:hover {
            background-color: #F3F4F6;
        }

        .folder-tree-item.active {
            background-color: #DBEAFE;
            font-weight: 600;
        }

        .folder-tree-wrapper {
            margin-bottom: 0.125rem;
        }

        .folder-children {
            margin-left: 0.5rem;
        }

        .expand-icon {
            transition: transform 0.2s;
        }

        .drop-zone-active {
            border-color: #3B82F6 !important;
            background-color: #EFF6FF !important;
        }

        .view-toggle-btn.active {
            background-color: #3B82F6;
            color: white;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
        <div class="container mx-auto px-4 py-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-cloud text-blue-600 text-2xl"></i>
                    <h1 class="text-xl font-bold text-gray-900">Cloud Storage Manager</h1>
                </div>
                <div class="flex items-center space-x-3">
                    <span class="text-sm text-gray-600">
                        <i class="fas fa-database mr-1"></i>{{ session.get('bucket', 'N/A') }}
                    </span>
                    <button id="searchBtn" class="px-3 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition">
                        <i class="fas fa-search"></i>
                    </button>
                    <a href="{{ url_for('s3_explore.configure_storage') }}"
                       class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-cog mr-1"></i>Settings
                    </a>
                    <a href="{{ url_for('s3_explore.logout') }}"
                       class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                        <i class="fas fa-sign-out-alt mr-1"></i>Logout
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6">
        <div class="flex gap-6 h-[calc(100vh-140px)]">
            <!-- Left Sidebar - Folder Tree -->
            <aside class="w-64 bg-white rounded-lg shadow-sm border overflow-hidden flex-shrink-0">
                <div class="p-4 border-b bg-gray-50">
                    <h2 class="font-semibold text-gray-900">
                        <i class="fas fa-folder-tree mr-2 text-blue-600"></i>Folders
                    </h2>
                </div>
                <div id="folderTree" class="p-3 overflow-y-auto h-[calc(100%-60px)]">
                    <div class="folder-tree-item active" data-path="">
                        <i class="fas fa-home mr-2 text-gray-600"></i>
                        <span>Root</span>
                    </div>
                    <!-- Folder tree will be populated here -->
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 flex flex-col overflow-hidden">
                <!-- Toolbar -->
                <div class="bg-white rounded-lg shadow-sm border p-4 mb-4">
                    <div class="flex justify-between items-center mb-3">
                        <!-- Breadcrumb Navigation -->
                        <nav id="breadcrumb" class="flex items-center text-sm">
                            <button class="breadcrumb-item hover:text-blue-600 transition" data-path="">
                                <i class="fas fa-home mr-1"></i>Home
                            </button>
                        </nav>

                        <!-- View Toggle & Actions -->
                        <div class="flex items-center space-x-2">
                            <div class="flex bg-gray-100 rounded-lg p-1">
                                <button id="gridViewBtn" class="view-toggle-btn active px-3 py-1 rounded transition">
                                    <i class="fas fa-th"></i>
                                </button>
                                <button id="listViewBtn" class="view-toggle-btn px-3 py-1 rounded transition">
                                    <i class="fas fa-list"></i>
                                </button>
                            </div>
                            <button id="selectAllBtn" class="px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition">
                                <i class="fas fa-check-square mr-1"></i>Select All
                            </button>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center space-x-2">
                        <button id="uploadBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                            <i class="fas fa-upload mr-2"></i>Upload Files
                        </button>
                        <button id="newFolderBtn" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                            <i class="fas fa-folder-plus mr-2"></i>New Folder
                        </button>
                        <button id="downloadBtn" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition" disabled>
                            <i class="fas fa-download mr-2"></i>Download
                        </button>
                        <button id="deleteBtn" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition" disabled>
                            <i class="fas fa-trash mr-2"></i>Delete
                        </button>
                        <button id="shareBtn" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition" disabled>
                            <i class="fas fa-share-alt mr-2"></i>Share
                        </button>
                    </div>
                </div>

                <!-- File Explorer Area -->
                <div class="flex-1 bg-white rounded-lg shadow-sm border overflow-hidden flex flex-col">
                    <!-- Upload Drop Zone -->
                    <div id="dropZone" class="border-2 border-dashed border-gray-300 m-4 p-8 rounded-lg text-center hover:border-blue-500 transition-colors cursor-pointer">
                        <i class="fas fa-cloud-upload-alt text-4xl text-gray-400 mb-3"></i>
                        <p class="text-gray-600 mb-2">Drag & Drop files here or click to select</p>
                        <p class="text-sm text-gray-500">You can upload multiple files at once</p>
                        <input type="file" id="fileInput" class="hidden" multiple>
                    </div>

                    <!-- Upload Progress -->
                    <div id="uploadProgress" class="mx-4 mb-4 space-y-2 hidden">
                        <!-- Upload progress items will be added here -->
                    </div>

                    <!-- File/Folder List -->
                    <div id="fileExplorer" class="flex-1 overflow-y-auto p-4">
                        <div id="fileList" class="file-explorer-grid">
                            <!-- Files and folders will be listed here -->
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyState" class="flex-1 flex items-center justify-center text-gray-400 hidden">
                        <div class="text-center">
                            <i class="fas fa-folder-open text-6xl mb-4"></i>
                            <p class="text-lg">This folder is empty</p>
                            <p class="text-sm mt-2">Upload files or create a new folder to get started</p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Context Menu -->
    <div id="contextMenu" class="context-menu">
        <div class="context-menu-item" data-action="open">
            <i class="fas fa-folder-open mr-2 text-blue-600"></i>Open
        </div>
        <div class="context-menu-item" data-action="download">
            <i class="fas fa-download mr-2 text-green-600"></i>Download
        </div>
        <div class="context-menu-item" data-action="share">
            <i class="fas fa-share-alt mr-2 text-indigo-600"></i>Share
        </div>
        <div class="context-menu-item" data-action="rename">
            <i class="fas fa-edit mr-2 text-yellow-600"></i>Rename
        </div>
        <hr class="my-1">
        <div class="context-menu-item" data-action="delete">
            <i class="fas fa-trash mr-2 text-red-600"></i>Delete
        </div>
    </div>

    <!-- Modals -->
    <div id="previewModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg max-w-4xl max-h-[90vh] w-full m-4 overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b">
                <h3 class="text-lg font-semibold" id="previewTitle">Preview</h3>
                <button id="closePreview" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="previewContent" class="p-4 overflow-auto max-h-[calc(90vh-80px)]">
                <!-- Preview content will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        window.APP_BASE_PATH = "{{ request.script_root or '' }}";
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
