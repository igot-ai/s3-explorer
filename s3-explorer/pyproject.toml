[tool.poetry]
name = "dataroutine"
version = "0.1.0"
description = ""
authors = ["ntnhan21@clc.fitus.edu.vn"]
readme = "Readme.md"
include = [
    "src/dataroutine/modules/s3_explore/web/static/**/*",
    "src/dataroutine/modules/s3_explore/web/templates/**/*"
]
packages = [{include = "dataroutine", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.11.0,<3.14"
flask = "^3.0.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.34.0"}
python-dotenv = "^1.0.1"
tiktoken = ">=0.7.0,<1.0.0"
boto3 = "1.28.17"
werkzeug = "^3.0.1"
botocore = "1.31.17"
requests = "^2.31.0"
pillow = "^10.1.0"
python-magic = "^0.4.27"
gunicorn = "^21.2.0"
flask-cors = "^4.0.0"
b2sdk = "^1.23.0"
wasabi = "^1.1.2"
google-cloud-storage = "^2.14.0"
google-auth = "^2.27.0"
flask-wtf = "^1.2.1"
wtforms = "^3.1.1"
s3fs = "2024.9.0"
pymupdf = "^1.26.6"
pdfplumber = "^0.11.8"
dspy = {git = "https://github.com/igot-ai/dspy.git", branch = "main", extras = ["mcp"]}
markitdown = "^0.1.4"
marshmallow = "^4.1.1"
loguru = "^0.7.3"
build = "^1.3.0"
patool = "^4.0.3"
temporalio = "^1.7.0"
aiobotocore = "2.5.4"
pydantic = "2.9.2"
tokenizers = "0.19.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-mock = "^3.12.0"
pre-commit = "^4.5.0"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
